# RobinOS — 유휴 관리(hypridle)
# 라이브 환경은 비밀번호가 없으므로 자동 잠금은 하지 않고 화면만 절전한다.
# (설치된 시스템에서는 아래 lock 리스너 주석을 풀어 쓰면 된다.)

general {
    after_sleep_cmd = hyprctl dispatch dpms on
}

# 5분 유휴 → 화면 끔, 입력 시 켬
listener {
    timeout = 300
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

# 설치 시스템용(비번 있을 때): 10분 유휴 → 잠금
# listener {
#     timeout = 600
#     on-timeout = loginctl lock-session
# }
