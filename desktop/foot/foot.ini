# RobinOS terminal defaults (foot 1.28+).
# Installed to /etc/xdg/foot/foot.ini. Override in ~/.config/foot/foot.ini.
# The shell sends SIGUSR1 (dark) / SIGUSR2 (light) when the theme changes.

[main]
font=GeistMono Nerd Font:size=11
pad=18x14 center-when-maximized-and-fullscreen
initial-color-theme=dark

[scrollback]
lines=10000

[cursor]
style=beam
blink=yes

[mouse]
hide-when-typing=yes

# Draw foot's own title bar with minimize/maximize/close buttons, since Hyprland
# windows have no title bars and RobinOS opens windows floating like Windows.
[csd]
preferred=client
size=32
font=Geist:size=10
color=ff18181b
button-width=36
button-color=ffa1a1aa
button-minimize-color=ff18181b
button-maximize-color=ff18181b
button-close-color=ff18181b

[colors-dark]
background=09090b
foreground=e4e4e7
cursor=09090b fafafa
selection-foreground=fafafa
selection-background=3f3f46
regular0=27272a
regular1=f87171
regular2=4ade80
regular3=facc15
regular4=60a5fa
