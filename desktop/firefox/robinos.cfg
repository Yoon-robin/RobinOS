// RobinOS admin config for Firefox (the first line must be a comment).
// Firefox draws its toolbars, panels and new tab page in its own grey, and release
// Firefox installs no unsigned theme, so the kit's colours (desktop/gtk/firefox.css,
// made from Theme.qml by scripts/build-gtk-theme.py) go in as a user style sheet.
// The sheet only matches Firefox's own pages. Nothing else happens here.
try {
  const sss = Components.classes["@mozilla.org/content/style-sheet-service;1"]
    .getService(Components.interfaces.nsIStyleSheetService);
  const io = Components.classes["@mozilla.org/network/io-service;1"]
    .getService(Components.interfaces.nsIIOService);
  const sheet = io.newURI("file:///usr/share/robinos/firefox/robinos.css");
  if (!sss.sheetRegistered(sheet, sss.USER_SHEET)) {
    sss.loadAndRegisterSheet(sheet, sss.USER_SHEET);
  }
} catch (e) {
  Components.utils.reportError("robinos.cfg: " + e);
}
