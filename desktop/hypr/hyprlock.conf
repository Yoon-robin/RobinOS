# RobinOS lock screen (hyprlock 0.9+).
# Installed to /usr/share/robinos/hypr/hyprlock.conf and started by hypridle.
# Colors follow the RobinOS robin-ui V5 tokens (desktop/shell/Theme.qml).

$font = Pretendard Variable

general {
    hide_cursor = true
    ignore_empty_input = true
}

animations {
    enabled = true
    bezier = easeOut, 0.23, 1, 0.32, 1
    animation = fadeIn, 1, 4, easeOut
    animation = fadeOut, 1, 3, easeOut
    animation = inputFieldDots, 1, 2, easeOut
}

# A plain face: the kit has no glass and no blur
background {
    monitor =
    color = rgba(0a0e11ff)
}

# Clock
label {
    monitor =
    text = $TIME
    color = rgba(f0f0f0ff)
    font_size = 96
    font_family = $font
    position = 0, 190
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] LC_TIME=ko_KR.UTF-8 date +"%-m월 %-d일 %A"
    color = rgba(8a8e94ff)
    font_size = 16
    font_family = $font
    position = 0, 110
    halign = center
    valign = center
}

# Card
shape {
    monitor =
    size = 380, 150
    color = rgba(0f1115ff)
    rounding = 14
    border_size = 1
    border_color = rgba(ffffff1a)
    position = 0, -50
    halign = center
    valign = center
}

label {
    monitor =
    text = $USER
    color = rgba(f0f0f0ff)
    font_size = 17
    font_family = $font
    position = 0, -10
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 320, 40
    outline_thickness = 1
    dots_size = 0.2
    dots_spacing = 0.35
    dots_center = true
    outer_color = rgba(ffffff26)
    inner_color = rgba(ffffff08)
    font_color = rgba(f0f0f0ff)
    check_color = rgba(8a8e94ff)
    fail_color = rgba(e5475aff)
    fade_on_empty = false
    rounding = 7
    font_family = $font
    placeholder_text = <span foreground="##7d8187">비밀번호</span>
    fail_text = <span foreground="##e5475a">$PAMFAIL</span>
    position = 0, -75
    halign = center
    valign = center
}

