<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  RobinOS font defaults: Geist + Pretendard for the interface, Geist Mono for code.
  Installed to /etc/fonts/conf.d/56-robinos-fonts.conf.
  Geist and Pretendard come from scripts/fetch-fonts.sh; Inter, Noto and
  GeistMono Nerd Font come from the Arch repositories and act as fallbacks.
-->
<fontconfig>
  <alias>
    <family>sans-serif</family>
    <prefer>
      <family>Geist</family>
      <family>Pretendard Variable</family>
      <family>Inter</family>
      <family>Noto Sans CJK KR</family>
    </prefer>
  </alias>

  <alias>
    <family>monospace</family>
    <prefer>
      <family>Geist Mono</family>
      <family>GeistMono Nerd Font</family>
      <family>Noto Sans Mono CJK KR</family>
    </prefer>
  </alias>

  <!-- Geist has no Hangul: fall back to Pretendard right after it. -->
  <alias binding="same">
    <family>Geist</family>
    <accept>
      <family>Pretendard Variable</family>
    </accept>
    <default>
      <family>sans-serif</family>
    </default>
  </alias>

  <alias binding="same">
    <family>Geist Mono</family>
    <accept>
      <family>GeistMono Nerd Font</family>
      <family>Noto Sans Mono CJK KR</family>
    </accept>
    <default>
      <family>monospace</family>
    </default>
  </alias>

  <alias binding="same">
    <family>GeistMono Nerd Font</family>
    <accept>
      <family>Noto Sans Mono CJK KR</family>
    </accept>
  </alias>
</fontconfig>
