<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  RobinOS font defaults: Geist + Pretendard for the interface, Geist Mono for code.
  Installed to /etc/fonts/conf.d/56-robinos-fonts.conf.
  Geist, Geist Mono and Pretendard come from scripts/fetch-fonts.sh; Inter and
  Noto come from the Arch repositories and act as fallbacks. GeistMono Nerd Font
  is no longer installed (its icon glyphs went unused and it cost the ISO 120 MB)
  but stays in the aliases for anyone who adds it.
-->
<fontconfig>
  <alias>
    <family>sans-serif</family>
    <prefer>
      <family>Geist</family>
      <family>Pretendard Variable</family>
      <family>Inter</family>
      <family>Noto Sans CJK KR</family>
    </prefer>
  </alias>

  <alias>
    <family>monospace</family>
    <prefer>
      <family>Geist Mono</family>
      <family>GeistMono Nerd Font</family>
      <family>Noto Sans Mono CJK KR</family>
    </prefer>
  </alias>

  <!-- Geist has no Hangul: fall back to Pretendard right after it. -->
  <alias binding="same">
    <family>Geist</family>
    <accept>
      <family>Pretendard Variable</family>
    </accept>
    <default>
      <family>sans-serif</family>
    </default>
  </alias>

  <alias binding="same">
    <family>Geist Mono</family>
    <accept>
      <family>GeistMono Nerd Font</family>
      <family>Noto Sans Mono CJK KR</family>
    </accept>
    <default>
      <family>monospace</family>
    </default>
  </alias>

  <alias binding="same">
    <family>GeistMono Nerd Font</family>
    <accept>
      <family>Noto Sans Mono CJK KR</family>
    </accept>
  </alias>

  <!--
    Hangul next to Geist Mono: a terminal gives each Hangul syllable two cells
    (2 x 0.6 em), but Noto's syllables are 1.0 em wide, so a gap opened between
    them ("미 션  2"). Drawn 1.16 times larger they fill the cells, like foot's
    "Noto Sans Mono CJK KR:size=12.5" next to Geist Mono 11 did (Ptyxis, T-154).
    Only this monospace family; Noto Sans CJK KR in the interface stays as it is.
  -->
  <match target="font">
    <test name="family">
      <string>Noto Sans Mono CJK KR</string>
    </test>
    <edit name="matrix" mode="assign">
      <times>
        <name>matrix</name>
        <matrix>
          <double>1.16</double><double>0</double>
          <double>0</double><double>1.16</double>
        </matrix>
      </times>
    </edit>
  </match>
</fontconfig>
