<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  RobinOS font defaults: Geist + Pretendard for the interface, Geist Mono for code.
  Installed to /etc/fonts/conf.d/56-robinos-fonts.conf.
  Geist, Geist Mono and Pretendard come from scripts/fetch-fonts.sh; Inter and
  Noto come from the Arch repositories and act as fallbacks. GeistMono Nerd Font
  is no longer installed (its icon glyphs went unused and it cost the ISO 120 MB)
  but stays in the aliases for anyone who adds it.
-->
<fontconfig>
  <alias>
    <family>sans-serif</family>
    <prefer>
      <family>Geist</family>
      <family>Pretendard Variable</family>
      <family>Inter</family>
      <family>Noto Sans CJK KR</family>
    </prefer>
  </alias>

  <alias>
    <family>monospace</family>
    <prefer>
      <family>Geist Mono</family>
      <family>GeistMono Nerd Font</family>
      <family>Noto Sans Mono CJK KR</family>
    </prefer>
  </alias>

  <!-- Geist has no Hangul: fall back to Pretendard right after it. -->
  <alias binding="same">
    <family>Geist</family>
    <accept>
      <family>Pretendard Variable</family>
    </accept>
    <default>
      <family>sans-serif</family>
    </default>
  </alias>

  <alias binding="same">
    <family>Geist Mono</family>
    <accept>
      <family>GeistMono Nerd Font</family>
      <family>Noto Sans Mono CJK KR</family>
    </accept>
    <default>
      <family>monospace</family>
    </default>
  </alias>

  <alias binding="same">
    <family>GeistMono Nerd Font</family>
    <accept>
      <family>Noto Sans Mono CJK KR</family>
    </accept>
  </alias>

  <!--
    Hangul next to Geist Mono: a terminal gives each Hangul syllable two cells
    (2 x 0.6 em), but Noto's syllables are 1.0 em wide, so a gap opened between
    them ("미 션  2"). Drawn 1.16 times wider they fill the cells (Ptyxis, T-154).
    Only wider: scaled both ways, the rows grew from 22 to 28 px, because Pango
    sizes rows by the Korean font's height under a Korean locale, and a 28-row
    terminal no longer fit a 900 px screen (boot test, 2026-10-12).
    Only where Noto fills in for Geist Mono (terminals, code), so an app that asks
    for Noto Sans Mono CJK KR itself, or the interface's Noto Sans CJK KR, keeps
    its size (third ChatGPT review: a global matrix reaches every app). A Hangul
    mono font such as D2Coding has the same gap: its Latin is 0.5 em, Geist Mono's 0.6.
  -->
  <match target="font">
    <test target="pattern" name="family">
      <string>Geist Mono</string>
    </test>
    <test name="family">
      <string>Noto Sans Mono CJK KR</string>
    </test>
    <edit name="matrix" mode="assign">
      <times>
        <name>matrix</name>
        <matrix>
          <double>1.16</double><double>0</double>
          <double>0</double><double>1</double>
        </matrix>
      </times>
    </edit>
  </match>
</fontconfig>
