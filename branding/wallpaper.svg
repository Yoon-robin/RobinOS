<svg xmlns="http://www.w3.org/2000/svg" width="2560" height="1440" viewBox="0 0 2560 1440">
  <defs>
    <!-- 딥다크 대각 베이스 -->
    <linearGradient id="base" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141a29"/>
      <stop offset="42%" stop-color="#0c0f18"/>
      <stop offset="100%" stop-color="#08090f"/>
    </linearGradient>
    <!-- 부드러운 오로라 글로우들 -->
    <radialGradient id="glowBlue" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#78aaff" stop-opacity="0.26"/>
      <stop offset="55%" stop-color="#78aaff" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#78aaff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowViolet" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7d5fff" stop-opacity="0.24"/>
      <stop offset="55%" stop-color="#7d5fff" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#7d5fff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowTeal" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5ad4e6" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#5ad4e6" stop-opacity="0"/>
    </radialGradient>
    <!-- 가장자리 비네트 -->
    <radialGradient id="vignette" cx="50%" cy="46%" r="75%">
      <stop offset="55%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.42"/>
    </radialGradient>
  </defs>

  <rect width="2560" height="1440" fill="url(#base)"/>

  <!-- 오로라: 좌상 블루, 우하 바이올렛, 중상 옅은 틸 -->
  <ellipse cx="620" cy="340" rx="1150" ry="950" fill="url(#glowBlue)"/>
  <ellipse cx="2050" cy="1180" rx="1200" ry="1000" fill="url(#glowViolet)"/>
  <ellipse cx="1720" cy="480" rx="760" ry="700" fill="url(#glowTeal)"/>

  <!-- 아주 옅은 파인 그리드 (질감) -->
  <g stroke="#ffffff" stroke-opacity="0.018" stroke-width="1">
    <line x1="0" y1="480" x2="2560" y2="480"/>
    <line x1="0" y1="960" x2="2560" y2="960"/>
    <line x1="640" y1="0" x2="640" y2="1440"/>
    <line x1="1280" y1="0" x2="1280" y2="1440"/>
    <line x1="1920" y1="0" x2="1920" y2="1440"/>
  </g>

  <rect width="2560" height="1440" fill="url(#vignette)"/>
</svg>
