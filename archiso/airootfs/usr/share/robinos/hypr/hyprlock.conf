# RobinOS lock screen (hyprlock 0.9+).
# Installed to /usr/share/robinos/hypr/hyprlock.conf and started by hypridle.
# Colors follow the RobinOS zinc tokens (desktop/shell/Theme.qml).

$font = Geist

general {
    hide_cursor = true
    ignore_empty_input = true
}

animations {
    enabled = true
    bezier = easeOut, 0.23, 1, 0.32, 1
    animation = fadeIn, 1, 4, easeOut
    animation = fadeOut, 1, 3, easeOut
    animation = inputFieldDots, 1, 2, easeOut
}

background {
    monitor =
    path = screenshot
    color = rgba(09090bff)
    blur_passes = 3
    blur_size = 8
    brightness = 0.4
    contrast = 0.9
    vibrancy = 0.1
}

# Clock
label {
    monitor =
    text = $TIME
    color = rgba(fafafaff)
    font_size = 96
    font_family = $font
    position = 0, 190
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] LC_TIME=ko_KR.UTF-8 date +"%-m월 %-d일 %A"
    color = rgba(a1a1aaff)
    font_size = 16
    font_family = $font
    position = 0, 110
    halign = center
    valign = center
}

# Card
shape {
    monitor =
    size = 380, 210
    color = rgba(121214e6)
    rounding = 16
    border_size = 1
    border_color = rgba(ffffff1a)
    position = 0, -80
    halign = center
    valign = center
}

label {
    monitor =
    text = $USER
    color = rgba(fafafaff)
    font_size = 17
    font_family = $font
    position = 0, -20
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 320, 40
    outline_thickness = 1
    dots_size = 0.2
    dots_spacing = 0.35
    dots_center = true
    outer_color = rgba(ffffff26)
    inner_color = rgba(ffffff08)
    font_color = rgba(fafafaff)
    check_color = rgba(a1a1aaff)
    fail_color = rgba(f87171ff)
    fade_on_empty = false
    rounding = 8
    font_family = $font
    placeholder_text = <span foreground="##71717a">비밀번호</span>
    fail_text = <span foreground="##f87171">$PAMFAIL</span>
    position = 0, -80
    halign = center
    valign = center
}

label {
    monitor =
    text = Enter를 누르면 잠금이 풀려요
    color = rgba(71717aff)
    font_size = 12
    font_family = $font
    position = 0, -140
    halign = center
    valign = center
}

label {
    monitor =
    text = 허가받은 환경에서만 쓰는 보안 학습용 시스템이에요
    color = rgba(71717aff)
    font_size = 11
    font_family = $font
    position = 0, 32
    halign = center
    valign = bottom
}
