# systemd takes QEMU on Windows (WHPX, the boot test's VM) for VMware too, so the
# unit's own ConditionVirtualization=vmware lets it start and it fails at every
# boot (T-137). vmware-checkvm asks VMware itself; anywhere else the unit is
# skipped instead of failed.
[Service]
ExecCondition=/usr/bin/vmware-checkvm
