# RobinOS boot menu: "RobinOS Linux" entries (grub.d/10_linux adds " Linux") and the theme
GRUB_DISTRIBUTOR="RobinOS"
GRUB_THEME="/usr/share/grub/themes/robinos/theme.txt"
GRUB_GFXMODE=auto
GRUB_GFXPAYLOAD_LINUX=keep
GRUB_TERMINAL_OUTPUT=gfxterm
# GRUB 2.16's 31_efi_bootnext lists every firmware boot entry (USB, network,
# Windows again next to os-prober's entry); keep the menu short
GRUB_DISABLE_BOOTNEXT=true
