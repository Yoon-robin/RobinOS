# Which portal backend answers which request in the RobinOS session
# (XDG_CURRENT_DESKTOP=Hyprland). Without this file xdg-desktop-portal picks
# the GTK backend only as a "last resort" and nothing sets wallpapers.
#   hyprland: screenshots, screen sharing, global shortcuts
#   gtk:      file chooser, settings (dark mode, title bar buttons), printing, ...
#   robinos:  "배경으로 설정" in Files and Image Viewer (robinos-wallpaper-portal)
[preferred]
default=hyprland;gtk
org.freedesktop.impl.portal.Wallpaper=robinos
