<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  RobinOS font defaults, the robin-ui kit's: Pretendard for the interface,
  Cascadia Mono (ttf-cascadia-code, Cascadia Code without ligatures) for code.
  Installed to /etc/fonts/conf.d/56-robinos-fonts.conf.
  Geist, Geist Mono and Pretendard come from scripts/fetch-fonts.sh; Inter and
  Noto come from the Arch repositories and act as fallbacks. GeistMono Nerd Font
  is no longer installed (its icon glyphs went unused and it cost the ISO 120 MB)
  but stays in the aliases for anyone who adds it.
-->
<fontconfig>
  <alias>
    <family>sans-serif</family>
    <prefer>
      <family>Pretendard Variable</family>
      <family>Geist</family>
      <family>Inter</family>
      <family>Noto Sans CJK KR</family>
    </prefer>
  </alias>

  <alias>
    <family>monospace</family>
    <prefer>
      <family>Cascadia Mono</family>
      <family>Geist Mono</family>
      <family>GeistMono Nerd Font</family>
      <family>Noto Sans Mono CJK KR</family>
    </prefer>
  </alias>

  <!-- Geist has no Hangul: fall back to Pretendard right after it. -->
  <alias binding="same">
    <family>Geist</family>
    <accept>
      <family>Pretendard Variable</family>
    </accept>
    <default>
      <family>sans-serif</family>
    </default>
  </alias>

  <alias binding="same">
    <family>Geist Mono</family>
    <accept>
      <family>GeistMono Nerd Font</family>
      <family>Noto Sans Mono CJK KR</family>
    </accept>
    <default>
      <family>monospace</family>
    </default>
  </alias>

  <!-- Cascadia has no Hangul either -->
  <alias binding="same">
    <family>Cascadia Mono</family>
    <accept>
      <family>Noto Sans Mono CJK KR</family>
    </accept>
    <default>
      <family>monospace</family>
    </default>
  </alias>

  <alias binding="same">
    <family>GeistMono Nerd Font</family>
    <accept>
      <family>Noto Sans Mono CJK KR</family>
    </accept>
  </alias>

</fontconfig>
