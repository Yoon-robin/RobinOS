# RobinOS colors for the live ISO's BIOS boot menu (syslinux vesamenu), replacing
# archiso's. Same tokens as desktop/shell/Theme.qml (robin-ui V5): the card face, white on
# the chosen grey for the selected entry, the one blue for hotkeys. No shadows. Colors are #AARRGGBB.
# scripts/customize-iso-boot.sh puts these lines in place of archiso_head.cfg's.
MENU COLOR border       30;44   #ff32343b #f00f1115 none
MENU COLOR title        1;36;44 #fff0f0f0 #f00f1115 none
MENU COLOR sel          7;37;40 #fff0f0f0 #ff222629 all
MENU COLOR unsel        37;44   #ff8a8e94 #f00f1115 none
MENU COLOR hotkey       1;37;44 #ff4b7dfe #f00f1115 none
MENU COLOR hotsel       1;7;37;40 #ff4b7dfe #ff222629 all
MENU COLOR disabled     1;30;44 #ff32343b #f00f1115 none
MENU COLOR scrollbar    30;44   #ff32343b #f00f1115 none
MENU COLOR help         37;40   #ff8a8e94 #00000000 none
MENU COLOR timeout_msg  37;40   #ff7d8187 #00000000 none
MENU COLOR timeout      1;37;40 #fff0f0f0 #00000000 none
MENU COLOR msg07        37;40   #ff8a8e94 #00000000 none
MENU COLOR tabmsg       31;40   #ff7d8187 #00000000 none
MENU COLOR cmdmark      1;36;40 #ff4b7dfe #00000000 none
MENU COLOR cmdline      37;40   #fff0f0f0 #00000000 none
