# RobinOS colors for the live ISO's BIOS boot menu (syslinux vesamenu), replacing
# archiso's. Same tokens as desktop/shell/Theme.qml: a zinc card, white for the
# selected entry, Robin red for hotkeys. No shadows. Colors are #AARRGGBB.
# scripts/customize-iso-boot.sh puts these lines in place of archiso_head.cfg's.
MENU COLOR border       30;44   #ff3f3f46 #f0111113 none
MENU COLOR title        1;36;44 #fffafafa #f0111113 none
MENU COLOR sel          7;37;40 #fffafafa #ff27272a all
MENU COLOR unsel        37;44   #ffa1a1aa #f0111113 none
MENU COLOR hotkey       1;37;44 #ffe5484d #f0111113 none
MENU COLOR hotsel       1;7;37;40 #ffe5484d #ff27272a all
MENU COLOR disabled     1;30;44 #ff52525b #f0111113 none
MENU COLOR scrollbar    30;44   #ff3f3f46 #f0111113 none
MENU COLOR help         37;40   #ffa1a1aa #00000000 none
MENU COLOR timeout_msg  37;40   #ff71717a #00000000 none
MENU COLOR timeout      1;37;40 #fffafafa #00000000 none
MENU COLOR msg07        37;40   #ffa1a1aa #00000000 none
MENU COLOR tabmsg       31;40   #ff71717a #00000000 none
MENU COLOR cmdmark      1;36;40 #ffe5484d #00000000 none
MENU COLOR cmdline      37;40   #fffafafa #00000000 none
