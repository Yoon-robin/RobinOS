# RobinOS terminal defaults (foot 1.28+).
# Installed to /etc/xdg/foot/foot.ini. Override in ~/.config/foot/foot.ini.
# The shell sends SIGUSR1 (dark) / SIGUSR2 (light) when the theme changes.

[main]
# Hangul takes two cells. The fontconfig rule (56-robinos-fonts.conf) draws the
# Hangul stand-in 1.15 times larger so it fills them, for every terminal: so the
# same size here, or foot scales it twice and cuts off the top.
font=Cascadia Mono:size=11,Noto Sans Mono CJK KR:size=11
pad=18x14 center-when-maximized-and-fullscreen
initial-color-theme=dark
# Wide enough for fastfetch and the learning missions without wrapping
initial-window-size-chars=100x30

[scrollback]
lines=10000

[cursor]
style=beam
blink=yes

[mouse]
hide-when-typing=yes

# Draw foot's own title bar with minimize/maximize/close buttons, since Hyprland
# windows have no title bars and RobinOS opens windows floating like Windows.
[csd]
preferred=client
size=32
font=Pretendard Variable:size=10
color=ff0a0e11
button-width=36
button-color=ff8a8e94
button-minimize-color=ff0a0e11
button-maximize-color=ff0a0e11
button-close-color=ff0a0e11

