# RobinOS: compressed swap in RAM (zram), as Fedora does. With no swap at all, a
# PC with 8 GB fills up with a few browser tabs and the kernel starts killing
# apps; with zram it slows down first. zram-generator sets it up at every boot.
[zram0]
zram-size = min(ram / 2, 8192)
compression-algorithm = zstd
