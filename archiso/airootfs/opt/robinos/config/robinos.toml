[system]
name = "RobinOS"
version = "0.1.0-dev"
base = "arch"
purpose = "security-learning"

[desktop]
default = "hyprland"
shell = "quickshell"
locale = "ko_KR.UTF-8"
input_method = "fcitx5-hangul"

[safety]
pre_update_snapshots = true
default_scope = "local-labs-and-authorized-targets"

[profiles]
default = "core"
available = ["core", "security"]

