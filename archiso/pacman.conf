#
# RobinOS archiso pacman configuration
#

[options]
HoldPkg     = pacman glibc
Architecture = auto
CheckSpace
ParallelDownloads = 5
SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional

# Smaller live ISO (GitHub release files must be under 2 GiB): only the Korean
# and English translations, no help files or package docs, and only the English
# man pages. This file is used while mkarchiso builds the image; the live
# system's own /etc/pacman.conf, and what robin-install installs, keep everything.
NoExtract = usr/share/locale/* usr/share/help/* usr/share/doc/* usr/share/gtk-doc/* usr/share/man/*
NoExtract = !usr/share/locale/ko* !usr/share/locale/en* !usr/share/locale/locale.alias
NoExtract = !usr/share/help/C/* !usr/share/help/ko/*
NoExtract = !usr/share/man/man*

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

