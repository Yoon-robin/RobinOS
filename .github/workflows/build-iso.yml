name: Build RobinOS ISO

# 가상화 없이 클라우드(우분투 러너)에서 RobinOS 부팅 ISO 빌드.
# 수동 실행(Actions 탭 → Run workflow) 또는 main 푸시 시 동작.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'robinos_native/**'
      - 'boot/**'
      - '.github/workflows/build-iso.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.1

      - name: Install Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev

      - name: Build RobinOS (Flutter Linux)
        working-directory: robinos_native
        run: |
          flutter config --enable-linux-desktop
          flutter pub get
          flutter build linux --release

      - name: Stage RobinOS binary into live-build config
        run: |
          mkdir -p boot/config/includes.chroot/opt/robinos
          cp -r robinos_native/build/linux/x64/release/bundle/* boot/config/includes.chroot/opt/robinos/
          chmod +x boot/config/includes.chroot/usr/local/bin/robinos-session || true
          ls -la boot/config/includes.chroot/opt/robinos | head

      # ISO는 Debian bookworm 컨테이너 안에서 빌드 — 데비안 자체 live-build를 써서
      # 우분투 러너의 아카이브 레이아웃 불일치(Contents 경로/보안suite/모드)를 회피.
      # 컨테이너는 호스트 커널을 공유하므로 가상화 불필요. --privileged는 chroot/loop/mount용.
      - name: Build ISO (Debian bookworm container)
        run: |
          docker run --rm --privileged -v "$PWD:/work" -w /work/boot debian:bookworm bash -c '
            set -e
            apt-get update
            apt-get install -y live-build xorriso squashfs-tools mtools dosfstools ca-certificates
            bash build.sh
          '
          sudo chown -R "$(id -u):$(id -g)" boot 2>/dev/null || true

      - name: Find ISO
        id: iso
        run: |
          ISO=$(ls boot/*.iso | head -n1)
          echo "Built: $ISO ($(du -h "$ISO" | cut -f1))"
          echo "path=$ISO" >> "$GITHUB_OUTPUT"

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: robinos-iso
          path: boot/*.iso
          if-no-files-found: error
          retention-days: 14

      # 가상화 없이 QEMU 소프트웨어 에뮬레이션(TCG)으로 ISO를 부팅해보고
      # 부팅 중 화면을 여러 장 캡처 → 스크린샷 아티팩트. (best-effort)
      - name: Boot-test ISO in QEMU (software emulation, no KVM)
        continue-on-error: true
        run: |
          sudo apt-get install -y qemu-system-x86 imagemagick
          ISO=$(ls boot/*.iso | head -n1)
          echo "Booting $ISO in QEMU TCG (no KVM)…"
          qemu-system-x86_64 -machine q35 -accel tcg -m 4096 -smp 2 \
            -cdrom "$ISO" -boot d -vga virtio -display none \
            -qmp unix:/tmp/qmp.sock,server,nowait \
            -serial file:boot/boot-serial.log &
          QPID=$!
          python3 boot/qmp_shots.py /tmp || true
          for f in /tmp/shot*.ppm; do
            [ -f "$f" ] && convert "$f" "boot/$(basename "${f%.ppm}").png" || true
          done
          kill $QPID 2>/dev/null || true
          ls -la boot/*.png 2>/dev/null || echo "no screenshots captured"

      - name: Upload boot screenshots
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: robinos-boot-screenshots
          path: |
            boot/shot*.png
            boot/boot-serial.log
          if-no-files-found: warn
          retention-days: 14
