name: Build RobinOS ISO

on:
  push:
    branches:
      - main
    paths:
      - "archiso/**"
      - "assets/**"
      - "bin/**"
      - "config/**"
      - "desktop/**"
      - "installer/**"
      - "labs/**"
      - "packages/**"
      - "scripts/**"
      - "themes/**"
      - ".github/workflows/build-iso.yml"
  workflow_dispatch:

concurrency:
  group: build-iso-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ISO with archiso
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      # The package set (Hyprland, Firefox, QEMU, security tools) needs more room
      # than a fresh runner has free.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force
          df -h /

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build ISO in Arch Linux container
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --privileged \
            -v "$PWD:/repo" \
            -w /repo \
            archlinux:latest \
            bash -lc 'pacman -Syu --noconfirm --needed archiso grub sudo git && bash scripts/build-iso.sh'

      - name: Show result
        run: |
          ls -lh out/
          cat out/SHA256SUMS

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: robinos-iso
          path: |
            out/*.iso
            out/SHA256SUMS
          retention-days: 7
          compression-level: 0
          if-no-files-found: error

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: robinos-build-log
          path: build/logs/*.log
          retention-days: 7
          if-no-files-found: ignore
