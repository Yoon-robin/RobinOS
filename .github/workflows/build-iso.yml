name: Build RobinOS ISO

# 가상화 없이 클라우드(우분투 러너)에서 RobinOS 부팅 ISO 빌드.
# 수동 실행(Actions 탭 → Run workflow) 또는 main 푸시 시 동작.
on:
  workflow_dispatch:   # 수동 실행만 — 무거운 ISO 빌드(~18분)를 매 푸시마다 돌리지 않음.
    inputs:
      embed_ai:
        description: 'AI 모델을 ISO에 내장 (Ollama+모델 — ISO가 크게 늘어남)'
        type: boolean
        default: false
      ai_model:
        description: '내장할 Ollama 모델 (embed_ai=true일 때). 예: qwen2.5:1.5b, huihui_ai/qwen2.5-abliterate:7b'
        type: string
        default: 'qwen2.5:1.5b'

jobs:
  build:
    # ubuntu-22.04(glib 2.72) 에서 Flutter를 빌드 — ISO의 Debian bookworm(glib 2.74)보다
    # 구형이라 바이너리가 2.72까지의 심볼만 참조 → bookworm에서 정상 실행.
    # ubuntu-latest(24.04, glib 2.80)로 빌드하면 g_once_init_enter_pointer(2.80) 등
    # 신 심볼을 참조해 bookworm에서 'symbol lookup error'로 크래시함.
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    permissions:
      contents: write   # Release 생성/업로드용
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 30   # 릴리스 노트(최근 커밋)용 히스토리

      # 큰 AI 모델(7b=4.7GB 등) 내장 시 러너 디스크(~14GB)가 부족해질 수 있어
      # RobinOS 빌드와 무관한 사전설치 도구(dotnet/android/ghc/CodeQL)를 비워 ~20GB 확보.
      - name: Free disk space (large AI embed)
        if: ${{ inputs.embed_ai }}
        run: |
          echo "=== 정리 전 ==="; df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /usr/local/lib/android /opt/hostedtoolcache/CodeQL || true
          sudo docker image prune -a -f 2>/dev/null || true
          echo "=== 정리 후 ==="; df -h /

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.1

      - name: Install Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev

      - name: Build RobinOS (Flutter Linux)
        working-directory: robinos_native
        run: |
          flutter config --enable-linux-desktop
          flutter pub get
          flutter build linux --release

      - name: Stage RobinOS binary into live-build config
        run: |
          mkdir -p boot/config/includes.chroot/opt/robinos
          cp -r robinos_native/build/linux/x64/release/bundle/* boot/config/includes.chroot/opt/robinos/
          chmod +x boot/config/includes.chroot/usr/local/bin/robinos-session || true
          ls -la boot/config/includes.chroot/opt/robinos | head

      # embed_ai=true 면 부팅 훅의 'AI:' 줄을 활성화(Ollama+모델 내장). 기본은 건너뜀(ISO 가볍게).
      - name: Enable AI embed (optional)
        if: ${{ inputs.embed_ai }}
        run: |
          HOOK=boot/config/hooks/live/0100-robinos.hook.chroot
          echo "AI 내장 활성화 — 모델: ${{ inputs.ai_model }}"
          sed -i -e 's/^# AI: //' -e "s|__AI_MODEL__|${{ inputs.ai_model }}|" "$HOOK"
          echo "=== 활성화된 훅 AI 블록 ==="; sed -n '24,30p' "$HOOK"

      # ISO는 Debian bookworm 컨테이너 안에서 빌드 — 데비안 자체 live-build를 써서
      # 우분투 러너의 아카이브 레이아웃 불일치(Contents 경로/보안suite/모드)를 회피.
      # 컨테이너는 호스트 커널을 공유하므로 가상화 불필요. --privileged는 chroot/loop/mount용.
      - name: Build ISO (Debian bookworm container)
        run: |
          docker run --rm --privileged -v "$PWD:/work" -w /work/boot debian:bookworm bash -c '
            set -e
            apt-get update
            apt-get install -y live-build xorriso squashfs-tools mtools dosfstools ca-certificates
            bash build.sh
          '
          sudo chown -R "$(id -u):$(id -g)" boot 2>/dev/null || true

      - name: Find ISO
        id: iso
        run: |
          ISO=$(ls boot/*.iso | head -n1)
          echo "Built: $ISO ($(du -h "$ISO" | cut -f1))"
          echo "path=$ISO" >> "$GITHUB_OUTPUT"

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: robinos-iso
          path: boot/*.iso
          if-no-files-found: error
          retention-days: 14

      # 일반 ISO를 GitHub Release에 항상 업로드(최신 빌드 제공). 릴리스 노트는 최근 커밋으로 자동 생성.
      # AI 내장 ISO(~6GB)는 Release 단일파일 2GB 한도를 넘어 제외 — 위 아티팩트로만 받음.
      - name: Release ISO (일반 빌드만)
        if: ${{ !inputs.embed_ai }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ISO="${{ steps.iso.outputs.path }}"
          SIZE=$(du -h "$ISO" | cut -f1)
          BYTES=$(stat -c%s "$ISO")
          if [ "$BYTES" -ge $((2*1024*1024*1024)) ]; then
            echo "ISO $SIZE > 2GB — Release 건너뜀(아티팩트로만 제공)."; exit 0
          fi
          TAG="v$(date -u +%Y.%m.%d-%H%M)"
          {
            echo "RobinOS 부팅 ISO ($SIZE)."
            echo ""
            echo "USB로 구워 부팅하면 sway 데스크톱 + Robin 비서가 뜹니다."
            echo "설정 > Robin 두뇌에서 AI 모델(Ollama)을 켤 수 있어요."
            echo ""
            echo "## 최근 변경"
            git log -15 --pretty=format:'- %s' | grep -vE '^- (Merge|Co-Authored)' || true
          } > notes.md
          gh release create "$TAG" "$ISO" --title "RobinOS $TAG ($SIZE)" --notes-file notes.md
          echo "Release $TAG 생성 + ISO 업로드 완료."

      # 가상화 없이 QEMU 소프트웨어 에뮬레이션(TCG)으로 ISO를 부팅해보고
      # 부팅 중 화면을 여러 장 캡처 → 스크린샷 아티팩트. (best-effort)
      - name: Boot-test ISO in QEMU (software emulation, no KVM)
        continue-on-error: true
        run: bash boot/boottest.sh

      - name: Upload boot screenshots
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: robinos-boot-screenshots
          path: |
            boot/shot*.png
            boot/boot-serial.log
          if-no-files-found: warn
          retention-days: 14
