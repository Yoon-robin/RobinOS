name: Arch Package Check

# Manual only: RobinOS is built and tested on the owner's PC (docs/testing.md).
on:
  workflow_dispatch:

jobs:
  arch-package-check:
    name: Check package names against Arch repositories
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run package check in Arch Linux container
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$PWD:/repo" \
            -w /repo \
            archlinux:latest \
            bash -lc 'pacman -Sy --noconfirm && bash scripts/check-arch-packages.sh'

