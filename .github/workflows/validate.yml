name: Validate

# Manual only: RobinOS is built and tested on the owner's PC (docs/testing.md).
on:
  workflow_dispatch:

jobs:
  static-validation:
    name: Static project validation
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run RobinOS static validator
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File scripts/validate-project.ps1

  shell-syntax:
    name: Shell syntax check
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check Bash scripts
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' script; do
            bash -n "$script"
          done < <(find scripts bin installer archiso/airootfs/root archiso/airootfs/usr/local/bin -type f \( -name '*.sh' -o -name 'robinctl' \) -print0)
          # The installer backend and test drivers are Python
          python3 -m py_compile installer/robin-install scripts/*.py

  desktop-check:
    name: Desktop config check (Lua, Hyprland, QML)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run desktop checks in Arch Linux container
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$PWD:/repo" \
            -w /repo \
            archlinux:latest \
            bash -lc 'pacman -Syu --noconfirm --needed lua qt6-declarative hyprland && bash scripts/check-desktop.sh'

